<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>中大课表社区管理台</title><style>body{font:16px system-ui;margin:auto;max-width:900px;padding:32px;background:#f3f7f5;color:#10251e}section{background:white;padding:20px;border-radius:18px;margin:14px 0}input,select,button,textarea{font:inherit;padding:10px;margin:5px;border:1px solid #b6c9c1;border-radius:10px}input,textarea{width:min(620px,90%)}button{background:#176b52;color:white}.report{border-top:1px solid #ddd;padding:10px 0}code{word-break:break-all}</style><h1>社区内测管理台</h1><p>令牌只保存在当前标签页内存，关闭页面即清除。</p><section><h2>连接</h2><input id="base" placeholder="https://CloudBase域名"><br><textarea id="token" placeholder="管理员 accessToken"></textarea><br><button onclick="reports()">读取举报</button></section><section><h2>创建邀请码</h2><input id="code" placeholder="邀请码"><input id="uses" type="number" value="10" min="1" max="100"><button onclick="invite()">创建</button></section><section><h2>管理操作</h2><input id="target" placeholder="帖子、评论、用户或举报编号"><select id="action"><option>HIDE_POST</option><option>DELETE_COMMENT</option><option>BAN_USER</option><option>RESOLVE_REPORT</option></select><input id="reason" placeholder="原因"><button onclick="moderate()">执行并审计</button></section><section><h2>举报</h2><div id="out">尚未加载</div></section><script>
const req=async(path,method='GET',body)=>{const r=await fetch(base.value.replace(/\/$/,'')+'/v1'+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token.value.trim()},body:body&&JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):{}};
async function reports(){try{const x=await req('/admin/reports');out.innerHTML=x.map(r=>`<div class=report><b>${r.targetType}</b> <code>${r.targetId}</code><br>${r.reason}<br><small>${r.reporter} · ${r.status} · ${r.createdAt}</small></div>`).join('')||'暂无举报'}catch(e){alert(e)}}
async function invite(){try{await req('/admin/invites','POST',{code:code.value,maxUses:+uses.value});alert('已创建')}catch(e){alert(e)}}
async function moderate(){if(!confirm('确认执行管理操作？'))return;try{await req('/admin/moderate/'+encodeURIComponent(target.value),'POST',{action:action.value,reason:reason.value});alert('已记录')}catch(e){alert(e)}}
</script></html>
